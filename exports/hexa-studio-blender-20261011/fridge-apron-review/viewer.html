<!doctype html><html><meta charset="utf-8"><title>冷蔵庫下の幕板・点検</title>
<style>body{margin:0;background:#ddd}canvas{display:block}#label{position:absolute;left:20px;top:16px;background:#ffffffe0;padding:10px;font:16px sans-serif}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
<div id="label"></div><script type="module">
import * as T from 'three';import{GLTFLoader}from'./vendor/GLTFLoader.js';import{MeshoptDecoder}from'./vendor/meshopt_decoder.module.js';
const scene=new T.Scene();scene.background=new T.Color('#dddddd');
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
scene.add(new T.HemisphereLight(0xffffff,0x888888,2.2));const light=new T.DirectionalLight(0xffffff,2.4);light.position.set(3,4,3);scene.add(light);const fill=new T.DirectionalLight(0xffffff,1);fill.position.set(-1,1,-3);scene.add(fill);
const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.001,100);let model;
const loader=new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
window.load=async(url)=>{if(model){scene.remove(model);model.traverse(n=>{if(n.isMesh){n.geometry.dispose();const a=Array.isArray(n.material)?n.material:[n.material];a.forEach(m=>m.dispose())}})}model=(await loader.loadAsync(url)).scene;scene.add(model);model.traverse(n=>{if(n.isMesh)n.material.aoMapIntensity=.35});scene.updateMatrixWorld(true);return new T.Box3().setFromObject(model)};
window.shot=(view,label,only=false)=>{model.traverse(n=>{if(n.isMesh)n.visible=!only||n.userData.source_body_index===0||n.parent.userData.source_body_index===0});
const target=new T.Vector3(-.19,.065,2.13);
const offsets={aisle:[.9,.30,-.22],below:[.65,-.17,-.30],front:[.95,0,0],low:[.9,-.035,.16],whole:[1.6,1.1,-1.3]};
if(view==='whole')target.set(-.33,.38,2.40);camera.position.copy(target).add(new T.Vector3(...offsets[view]));camera.lookAt(target);camera.updateMatrixWorld();renderer.render(scene,camera);document.getElementById('label').textContent=label;return{position:camera.position.toArray(),target:target.toArray()};};window.ready=true;
</script></html>
